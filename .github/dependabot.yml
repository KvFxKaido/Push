# Dependabot version updates for the Push monorepo.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Scope: npm/pnpm (one workspace), GitHub Actions, pip (Modal sandbox), Docker.
# Minor/patch bumps are grouped into a single PR to limit churn — every PR here
# also spins up the codex/gemini review workflows and a Workers Builds deploy,
# so noise has a real cost. Major bumps come as individual PRs so they get
# reviewed on their own.
version: 2

updates:
  # ── pnpm workspace: root + app + mcp/github-server ───────────────
  # One entry, not three. The workspace has a single pnpm-lock.yaml, so
  # per-manifest entries would each rewrite the same lockfile and collide —
  # every PR after the first would need a rebase (exactly what happened to the
  # old app/ and root/ manifests under npm). Dependabot walks the workspace
  # packages from the root manifest. The `npm` ecosystem covers pnpm.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      workspace-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # mermaid 12: streamdown (the chat markdown renderer) still depends on
      # mermaid ^11 (checked 2.7.1, 2026-10-25). Push also imports mermaid
      # directly (MermaidArtifact), so a 12 bump would bundle two copies, and
      # Dependabot can't resolve it (#1653). Drop this once streamdown moves to
      # mermaid 12. Minor/patch updates of 11 still arrive via the group above.
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]

  # ── pnpm, standalone: app/electron ───────────────────────────────
  # A SECOND entry is required here, and it is the exception the note above
  # does not cover. app/electron carries its own pnpm-lock.yaml because it
  # installs with --ignore-workspace (see app/README.md "Desktop app"), so it
  # is not one of the workspace packages Dependabot reaches from the root
  # manifest — it was invisible to every update and every security PR until
  # this entry existed. Symptom that found it: alert #103 (fast-uri) had no
  # PR and never would have, while its twin #102 in the root lockfile did.
  # It cannot collide with the root entry: different lockfile, no overlap.
  - package-ecosystem: "npm"
    directory: "/app/electron"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      electron-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── GitHub Actions: workflow action versions ─────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      actions-all:
        patterns: ["*"]

  # ── pip: Modal sandbox (sandbox/requirements.txt) ────────────────
  - package-ecosystem: "pip"
    directory: "/sandbox"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # ── Docker: Dockerfile + Dockerfile.sandbox (repo root) ──────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # Dockerfile.sandbox runs the *user's* repo commands, so its Node and
      # Python majors are a deliberate choice, not a version to chase.
      #
      # Node stays on an LTS line: v22 is Jod, v24 is Krypton, and v26 is
      # `lts: false` (checked against nodejs.org/dist/index.json, 2026-10-26).
      # The image also ships no compiler, so every native module has to come
      # from a prebuilt binary — and prebuilts are thinnest on the newest
      # major, which makes this image more sensitive to a Current release than
      # a normal app would be. `sandbox/app.py` (Modal) mirrors the pin via
      # `setup_22.x` and the two backends must agree, so a bump here is half a
      # change by construction. See the NOTE ON NODE header in
      # Dockerfile.sandbox (#1687 closed on these grounds).
      # Major-only is correct for Node: the major IS the release line, so this
      # holds 22 while 22.x minors and patches still arrive.
      - dependency-name: "library/node"
        update-types: ["version-update:semver-major"]
      # Python: the whole interpreter SERIES is pinned, not just the major.
      # Dependabot reads a Docker tag as `major.minor.patch`, so 3.11 -> 3.15
      # (#1686) is a semver-MINOR update — a major-only ignore would have let
      # every new series through and stopped only Python 4. Both bots caught
      # that on #1698. A new series is a wheel-availability gamble here: the
      # image pip-installs matplotlib/numpy/pandas unpinned, with no compiler
      # to fall back on when a wheel is missing for the new interpreter.
      # 3.11.x patches still arrive. (#1686 closed on these grounds.)
      - dependency-name: "library/python"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      # No ignore for `cloudflare/sandbox`: that tag must track the
      # @cloudflare/sandbox package version, since the image only carries
      # `sandbox-shim` and the two are a matched pair.
