name: Secret scan

# Separate from ci.yml on purpose: that workflow is path-filtered, and a secret
# can land in any file (a .claude allowlist, a doc, a config), so this one runs
# on every pull request and every push to main with no `paths` filter.
#
# It is the enforced counterpart to the optional gitleaks step in
# app/.husky/pre-commit, which skips on machines without the binary and can be
# bypassed with --no-verify.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  # Unlike ci.yml, a cancelled push run is not covered by the next one: each
  # push scans only its own before..after delta, so cancelling one would leave
  # those commits unscanned. A pull request run always rescans the whole
  # base..head range, so superseded PR runs are safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: '8.30.1'
  # sha256 of gitleaks_<version>_linux_x64.tar.gz from the release's checksums
  # file. Bump together with GITLEAKS_VERSION.
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the scan walks a commit range, and both ends of the
          # range must exist locally.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # Only the commits this event introduces are scanned. The existing
      # history carries known false positives (PEM-header parsing code, test
      # fixtures, old committed build output) that a full scan would report on
      # every run. A deliberate fixture in new code takes an inline
      # `gitleaks:allow` comment on its line.
      - name: Scan new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_AFTER_SHA"
          fi

          # No usable base means the range cannot be known. With a main-only
          # push trigger that is a force-push: the old tip is unreachable, so
          # it is not in this clone. The pushed commit is still scanned, but
          # the job then fails so a person looks, because a green check after
          # a partial scan would read as "all new commits are clean".
          partial=0
          if git cat-file -e "${base}^{commit}" 2>/dev/null; then
            range="${base}..${head}"
          else
            partial=1
            range="${head}^!"
          fi

          echo "Scanning $(git rev-list --count "$range") commit(s): $range"
          gitleaks git --redact --no-banner --log-opts="$range" .

          if [ "$partial" = "1" ]; then
            echo "::error::No usable base commit (${base:-empty}), so only ${head} was scanned. Scan the rewritten commits by hand: gitleaks git --log-opts=\"<old-tip>..${head}\""
            exit 1
          fi
