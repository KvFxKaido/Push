name: Secret scan

# Separate from ci.yml on purpose: that workflow is path-filtered, and a secret
# can land in any file (a .claude allowlist, a doc, a config), so this one runs
# on every pull request and every push to main with no `paths` filter.
#
# It is the enforced counterpart to the optional gitleaks step in
# app/.husky/pre-commit, which skips on machines without the binary and can be
# bypassed with --no-verify.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.30.1'
  # sha256 of gitleaks_<version>_linux_x64.tar.gz from the release's checksums
  # file. Bump together with GITLEAKS_VERSION.
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the scan walks a commit range, and both ends of the
          # range must exist locally.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # Only the commits this event introduces are scanned. The existing
      # history carries known false positives (PEM-header parsing code, test
      # fixtures, old committed build output) that a full scan would report on
      # every run. A deliberate fixture in new code takes an inline
      # `gitleaks:allow` comment on its line.
      - name: Scan new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_AFTER_SHA"
          fi

          # A push with no usable "before" (first push of a ref, or a commit
          # that is not in this clone) falls back to the pushed commit alone
          # and says so, instead of silently scanning nothing.
          if git cat-file -e "${base}^{commit}" 2>/dev/null; then
            range="${base}..${head}"
          else
            echo "::warning::No usable base commit (${base:-empty}); scanning ${head} only."
            range="${head}^!"
          fi

          echo "Scanning $(git rev-list --count "$range") commit(s): $range"
          gitleaks git --redact --no-banner --log-opts="$range" .
